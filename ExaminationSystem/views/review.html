<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examination System - Review</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-page="review">
    <div class="page">
      <header class="topbar">
        <div>
          <h1>Exam Review</h1>
          <p class="muted">See your answers and the correct ones.</p>
        </div>
        <div class="actions">
          <a class="btn ghost" href="/exam-ui">Back to Exam</a>
          <button id="logout" class="btn ghost">Logout</button>
        </div>
      </header>

      <section class="card">
        <div class="card-header">
          <h2 id="reviewTitle">Review</h2>
          <p id="reviewMeta" class="muted"></p>
        </div>
        <div id="reviewTable" class="table"></div>
        <div id="reviewStatus" class="alert hidden"></div>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
